server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index test-webrtc.html;

  # Proxy WHEP variant 1: /{stream}/whep (e.g., /c200/whep)
  location ~ ^/.*/whep$ {
    proxy_pass http://hls-gateway:8889;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
    proxy_buffering off;

    # hide upstream CORS to avoid duplicates
    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;

    # CORS for convenience
    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Headers "content-type,accept" always;
    add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
    if ($request_method = OPTIONS) { return 204; }
  }

  # Proxy WHEP variant 2: /whep/{stream}
  location ^~ /whep/ {
    proxy_pass http://hls-gateway:8889;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Headers;
    proxy_hide_header Access-Control-Allow-Methods;

    add_header Access-Control-Allow-Origin "$http_origin" always;
    add_header Vary Origin always;
    add_header Access-Control-Allow-Headers "content-type,accept" always;
    add_header Access-Control-Allow-Methods "GET,POST,OPTIONS" always;
    if ($request_method = OPTIONS) { return 204; }
  }

  # Serve static test page
  location / {
    try_files $uri $uri/ /test-webrtc.html;
  }
}
