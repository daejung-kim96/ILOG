name: ai   # 프로젝트 이름 고정 (중요!)

services:

  # ===========================
  # EMOTION AI (일기 감정 분석)
  # ===========================
  emotion-ai:
    build:
      context: ./emotion-ai
      dockerfile: Dockerfile
    image: emotion-ai:latest
    restart: unless-stopped
    ports:
      - "${EMOTION_AI_PORT:-8001}:8001"
    environment:
      - LLM_API_BASE=${LLM_API_BASE}
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4o}

      - MODEL_DIR=/app/out_roberta_60cls
      - MODEL_VERSION=${MODEL_VERSION:-60cls@local}
      - PIPELINE_ALPHA=${PIPELINE_ALPHA:-0.7}
      - MAX_LEN=${MAX_LEN:-256}
      - TEMPERATURE=1.0
      - TOKENIZERS_PARALLELISM=false

    volumes:
      - ${EMOTION_MODEL_PATH:-./emotion-ai/out_roberta_60cls}:/app/out_roberta_60cls:ro

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8001/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - ai-network

  # ===========================
  # VIDEO AI – MediaMTX Gateway
  # ===========================
  hls-gateway:
    build:
      context: ./video-ai/gateway
      dockerfile: Dockerfile
    image: hls-gateway:latest
    container_name: hls-gateway
    restart: unless-stopped
    environment:
      - STREAM_NAME=c200
      - RTSP_URL=${RTSP_URL}
      - HLS_PORT=8888
      - WEBRTC_PORT=8889
      - PUBLIC_HOSTNAME=${AI_SERVER_NAME:-ilog.p-e.kr}
    ports:
      - "8888:8888"
      - "8889:8889"
      - "8189:8189/udp"
      - "9997:9997"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9997/v3/paths/list || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 5

    networks:
      - ai-network

  # ===========================
  # VIDEO AI – Worker (FastAPI)
  # ===========================
  ai-worker:
    build:
      context: ./video-ai/worker
      dockerfile: Dockerfile
    image: ai-worker:latest
    container_name: ai-worker
    restart: unless-stopped
    environment:
      - CAMERA_ID=c200
      - RTSP_INPUT=rtsp://hls-gateway:8554/c200
      - AI_FPS=8
      - SENSITIVITY=0.015
      - MIN_ACTIVE_FRAMES=6
      - CLIP_DIR=/app/clips
      - POST_SEC=5
      - AUDIO_RTSP_URL=${RTSP_URL}
    volumes:
      - ./video-ai/worker/clips:/app/clips
      - ./video-ai/worker/models:/app/models:ro
    ports:
      - "9108:9108"
    depends_on:
      - hls-gateway

    networks:
      - ai-network

  # ===========================
  # NGINX (AI 서비스 게이트웨이)
  # ===========================
  ai-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: ai-nginx:latest
    restart: unless-stopped
    ports:
      - "${AI_NGINX_HTTP_PORT:-80}:80"
      - "${AI_NGINX_HTTPS_PORT:-443}:443"

    environment:
      - NGINX_SERVER_NAME=${AI_SERVER_NAME:-ilog.p-e.kr}
      - SSL_CERT_PATH=${AI_SSL_CERT_PATH:-/etc/letsencrypt/live/ilog.p-e.kr/fullchain.pem}
      - SSL_CERT_KEY_PATH=${AI_SSL_CERT_KEY_PATH:-/etc/letsencrypt/live/ilog.p-e.kr/privkey.pem}

    volumes:
      - ${AI_LETSENCRYPT_PATH:-/etc/letsencrypt}:/etc/letsencrypt:ro

    depends_on:
      emotion-ai:
        condition: service_healthy
      hls-gateway:
        condition: service_started
      ai-worker:
        condition: service_started

    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 15s
      timeout: 3s
      retries: 3

    networks:
      - ai-network

# ===========================
# NETWORK
# ===========================
networks:
  ai-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
