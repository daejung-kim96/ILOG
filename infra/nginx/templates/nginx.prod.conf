server {
    listen 80;
    server_name ${SERVER_NAME};
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ${SERVER_NAME};

    ssl_certificate ${SSL_CERT_PATH};
    ssl_certificate_key ${SSL_CERT_KEY_PATH};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    client_max_body_size ${CLIENT_MAX_BODY_SIZE};


    # =========================================
    #  🔥 공통 CORS 처리 (MSA 실무용)
    # =========================================

    # 허용할 Origin 화이트리스트 — 필요한 만큼 추가 가능
    set $cors_origin "";
    if ($http_origin ~* "(https?://(localhost:3000|${SERVER_NAME}))") {
        set $cors_origin $http_origin;
    }

    # Preflight + 실제 요청 모두 적용
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

    # Preflight OPTIONS 요청은 여기서 끝
    if ($request_method = OPTIONS) {
        return 204;
    }


    # =========================================
    # 🔥 Gateway로 REST 요청 전달
    # =========================================

    location /api/ {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # JWT Cookies + Authorization 헤더 유지
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location /oauth2/ {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    location /login/oauth2/ {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Authorization $http_authorization;
        proxy_set_header Cookie $http_cookie;
    }

    # =========================================
    # 🔥 React SPA 정적 파일 서빙
    # =========================================
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}
