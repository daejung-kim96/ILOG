server {
    listen 80;
    server_name ${SERVER_NAME};

    set_real_ip_from 10.0.0.0/8;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    client_max_body_size ${CLIENT_MAX_BODY_SIZE};

    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log ${ERROR_LOG_LEVEL};


    # =========================================
    #  🔥 공통 CORS (Preflight + 모든 응답 포함)
    # =========================================

    # 허용 Origin 화이트리스트 (필요 시 추가 가능)
    set $cors_origin "";
    if ($http_origin ~* "(https?://(localhost:3000|${SERVER_NAME}))") {
        set $cors_origin $http_origin;
    }

    # 모든 응답에 CORS 헤더 추가(always 필수)
    add_header Access-Control-Allow-Origin $cors_origin always;
    add_header Access-Control-Allow-Credentials "true" always;
    add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Requested-With, Accept" always;
    add_header Access-Control-Allow-Methods "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;

    # OPTIONS은 여기서 바로 종료
    if ($request_method = OPTIONS) {
        return 204;
    }


    # =========================================
    # 🔥 REST 요청: Gateway로 전달
    # =========================================
    location /api/ {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /oauth2/ {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }

    location /login/oauth2/ {
        proxy_pass ${GATEWAY_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }


    # =========================================
    # 🔥 프론트엔드 빌드 파일 서빙
    # =========================================
    location / {
        proxy_pass ${FRONTEND_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Cookie $http_cookie;
    }
}
